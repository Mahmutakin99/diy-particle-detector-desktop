<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIY Particle Detector</title><link rel="stylesheet" href="style.css"><script src="js/msgpack.min.js"></script><script src="js/FileSaver.js"></script></head>
<body><main><header><div><strong>DIY Particle Detector</strong><p id="subtitle">Canlı ölçüm</p></div><label><span id="language-label">Dil</span><select id="language"><option value="tr">Türkçe</option><option value="en">English</option></select></label></header>
<section class="controls"><label><span id="profile-label">Dedektör profili</span><select id="profile"><option value="electron">Elektron / beta dedektörü</option><option value="alpha">Alfa spektrometresi</option></select></label><label><span id="device-label">Giriş aygıtı</span><select id="device"><option>Varsayılan</option></select></label><label><span id="threshold-label">Tetikleme eşiği</span><input id="threshold" type="number" value="-800"></label><button id="start">Kaydı başlat</button><button id="stop" disabled>Durdur ve dışa aktar</button></section>
<p id="message" role="status">Mikrofonu bağlayıp kaydı başlatın.</p><section class="metrics"><article><span id="rate-label">Sayım hızı</span><strong id="rate">0.00 CPS</strong></article><article><span id="amplitude-label">Darbe genliği</span><strong id="amplitude">—</strong></article><article><span id="total-label">Toplam</span><strong id="total">0</strong></article></section><section class="controls"><label>Referans 1: genlik → keV<input id="reference-a" type="number" min="0" placeholder="genlik"></label><label>Enerji 1 (keV)<input id="energy-a" type="number" min="0" placeholder="keV"></label><label>Referans 2: genlik → keV<input id="reference-b" type="number" min="0" placeholder="genlik"></label><label>Enerji 2 (keV)<input id="energy-b" type="number" min="0" placeholder="keV"></label></section><canvas id="scope" aria-label="Live audio waveform"></canvas><p id="axis">Genlik ekseni. keV/MeV için iki kullanıcı referans noktasıyla kalibrasyon gerekir.</p></main><script src="js/pulse_recorder.js"></script></body></html>
