[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diy-particle-detector"
version = "0.1.1"
description = "Bilingual portable recording and analysis for the DIY Particle Detector"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.13", "msgpack>=1.0", "PySide6>=6.6", "sounddevice>=0.4", "pyqtgraph>=0.13"]

[project.scripts]
particle-detector = "particle_detector.app:main"
particle-detector-analyze = "particle_detector.analyze:main"

[tool.setuptools]
packages = ["particle_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
